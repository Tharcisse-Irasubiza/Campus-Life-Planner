<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Planner Test Suite</title>
  <style>
    body { font-family: ui-monospace, monospace; padding: 2.5rem; background: #0f172a; color: #7dd3fc; line-height: 1.6; }
    h1 { color: #f8fafc; font-size: 1.5rem; margin-bottom: 1rem; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    ul { margin-top: 1rem; list-style-type: none; background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
    li { margin-bottom: 0.75rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Campus Planner Test Suite</h1>
  <p>Running assertion checks for regex validation and planner-safe search behavior.</p>
  <ul id="test-results"></ul>

  <script type="module">
    import { rules } from './scripts/validators.js';
    import { compileRegex } from './scripts/search.js';

    const results = document.getElementById('test-results');

    function assert(name, condition) {
      const li = document.createElement('li');
      li.className = condition ? 'pass' : 'fail';
      li.textContent = `[${condition ? 'PASS' : 'FAIL'}] ${name}`;
      results.appendChild(li);
    }

    assert('Title regex forbids leading spaces', !rules.title.test(' Lab report'));
    assert('Title regex forbids trailing spaces', !rules.title.test('Lab report '));
    assert('Title regex allows standard text', rules.title.test('Lab report draft'));
    assert('Duration regex validates a valid minute value', rules.duration.test('90'));
    assert('Duration regex rejects non-numeric strings', !rules.duration.test('ninety'));
    assert('Due date regex validates correct YYYY-MM-DD format', rules.dueDate.test('2026-10-16'));
    assert('Due date regex rejects invalid month format', !rules.dueDate.test('2026-13-16'));
    assert('Tag regex accepts multi-word tags', rules.tag.test('Study Group'));
    assert('Advanced regex catches repeated words', rules.duplicateWords.test('Study study notes'));
    assert('Safe regex compiler parses valid patterns', compileRegex('study') instanceof RegExp);
    assert('Safe regex compiler handles malformed patterns safely', compileRegex('[unclosed') === null);
  </script>
</body>
</html>
